# INDEPENDENT stack: just the Next.js frontend. Servers are user-managed from
# the UI and persisted to ./data/servers.json, mounted as a volume so the list
# (and its tokens) survives restarts. No Endee server is bundled here — connect
# the UI to any reachable Endee servers you add.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: endee-web-ui:latest
    ports:
      - "3000:3000"
    environment:
      - APP_MODE=independent
      - SERVERS_FILE=/data/servers.json
    volumes:
      # Persist the user-managed server list across restarts.
      - ./data:/data
    restart: unless-stopped
