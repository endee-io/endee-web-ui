# BUNDLED stack: Next.js frontend + Endee vector DB server in one compose.
#
# The browser talks ONLY to the frontend; every Endee request is proxied through
# the Next server, which reaches the Endee server over the internal compose
# network. That has two consequences:
#   1. NDD_SERVER_URL uses the compose service name "endee" (resolved
#      server-side only, so the Endee port need NOT be published to the host or
#      be reachable from the browser).
#   2. The root token (NDD_ROOT_TOKEN) stays inside the frontend container and is
#      never sent to the browser.
#
# For INDEPENDENT mode instead, see docker-compose.independent.yml.

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: endee-web-ui:latest
    ports:
      - "3000:3000"
    environment:
      - APP_MODE=bundled
      # Server-side URL of the Endee server (compose-internal service name).
      - NDD_SERVER_URL=http://endee:8080/api/v2
      # Admin root token — kept server-side, never exposed to the browser.
      - NDD_ROOT_TOKEN=${NDD_ROOT_TOKEN:-}
    depends_on:
      - endee
    restart: unless-stopped

  endee:
    # Replace with the actual Endee server image.
    image: endee/server:latest
    restart: unless-stopped
